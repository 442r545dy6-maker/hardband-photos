<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hardband Photos</title>
  <meta name="theme-color" content="#1f2a36">
  <meta name="description" content="On-device hardband inspection photos for drill pipe.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hardband">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Back" hidden>‹</button>
    <h1 id="title">Hardband Photos</h1>
    <button id="syncBadge" class="sync-badge" aria-label="Team sync status" hidden></button>
    <button id="backupBtn" class="icon-btn" aria-label="Backup / Export" title="Backup">⤓</button>
    <button id="manageBtn" class="icon-btn" aria-label="Manage rigs, customers, specs" title="Manage">⚙</button>
  </header>
  <div id="inspBar" class="insp-bar" role="status" hidden>
    <span class="insp-text">🔍 Inspecting: <b id="inspRig"></b></span>
    <button id="inspDone" class="btn ghost insp-done" type="button">Done</button>
  </div>

  <main id="view" aria-live="polite"></main>

  <nav id="bottombar">
    <button id="inspBtn" class="btn secondary big insp-btn" type="button" hidden>🔍 Start inspection</button>
    <label for="camInput" id="camBtn" class="btn primary big">📷 Take Photo</label>
    <label for="libInput" id="libBtn" class="btn secondary big" aria-label="Pick from photo library">🖼 Library</label>
  </nav>

  <input id="camInput" class="vh" type="file" accept="image/*" capture="environment">
  <input id="libInput" class="vh" type="file" accept="image/*" multiple>
  <input id="importInput" class="vh" type="file" accept=".zip,application/zip">

  <div id="modalRoot"></div>
  <div id="toast" role="status" hidden></div>

  <script src="vendor/jszip.min.js"></script>
  <script src="config.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
